<!doctype html>
<html>
<head><meta charset="utf-8"><title>Wide tables</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .layout { display: flex; }
  nav { width: 240px; flex: none; }
  main { flex: 1; min-width: 0; }
  .scroll { overflow-x: auto; }
  .narrow { width: 420px; overflow-x: auto; border: 1px solid #ccc; }
  td { padding: 4px 8px; white-space: nowrap; }
  td.wide { min-width: 400px; }
  #veil { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); }
  #veil.open { display: block; }
</style>
</head>
<body>
<div class="layout">
  <nav><p>Admin</p></nav>
  <main>
    <h3>Clients</h3>
    <!-- Past the window's right edge: the table is far wider than the page. -->
    <div class="scroll">
      <table>
        <tr><td>Acme</td><td class="wide">acme.example</td><td class="wide">Mumbai</td><td class="wide">Active</td>
          <td class="wide">2026-10-01</td><td><button type="button" aria-label="Edit Acme">Edit</button></td></tr>
        <tr><td>Globex</td><td class="wide">globex.example</td><td class="wide">Pune</td><td class="wide">Active</td>
          <td class="wide">2026-10-02</td><td><button type="button" aria-label="Edit Globex">Edit</button></td></tr>
      </table>
    </div>
    <h3>Projects</h3>
    <!-- Inside the window, but clipped by a narrow panel that scrolls sideways. -->
    <div class="narrow">
      <table>
        <tr><td>Lookbook</td><td class="wide">Spring drop</td><td><button type="button" aria-label="Open Lookbook">Open</button></td></tr>
      </table>
    </div>
    <p id="status">Nothing edited</p>
    <button type="button" id="show">Show dialog</button>
  </main>
</div>
<!-- Over the whole page: the tables' rows are covered, on screen or off to the side. -->
<div id="veil"><div role="dialog" style="background:#fff;margin:80px auto;width:300px;padding:16px">
  <p>Dialog</p><button type="button" id="close" aria-label="Close dialog">Close</button></div></div>
<script>
document.getElementById('show').onclick = () => document.getElementById('veil').classList.add('open');
for (const b of document.querySelectorAll('td button'))
  b.addEventListener('click', () => { document.getElementById('status').textContent = 'Clicked: ' + b.getAttribute('aria-label'); });
</script>
</body>
</html>
