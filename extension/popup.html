<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ck-browser</title>
<style>
  body { width: 300px; margin: 0; padding: 12px; background: #202124; color: #e8eaed;
         font: 13px system-ui, sans-serif; }
  h2 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #9aa0a6; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .none { color: #9aa0a6; }
  button { background: #3c4043; color: #e8eaed; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  button:hover { background: #5f6368; }
  #handover { width: 100%; padding: 6px; margin-top: 8px; background: #8ab4f8; color: #202124; }
  #handover.stop { background: #d93025; color: #fff; }
  form { display: flex; gap: 6px; margin-top: 6px; }
  input[type=text] { flex: 1; background: #303134; color: #e8eaed; border: 1px solid #5f6368; border-radius: 4px; padding: 4px; }
  label { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  #status { margin: 0; }
  #error { color: #f28b82; margin: 8px 0 0; }
  .note { color: #9aa0a6; font-size: 11px; margin: 6px 0 0; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <p id="status"></p>
  <button id="handover"></button>
  <label><input type="checkbox" id="enabled"> Agents may open tabs</label>
  <section id="requests">
    <h2>Waiting for you</h2>
    <ul id="pending"></ul>
  </section>
  <h2>Allowed domains</h2>
  <ul id="domains"></ul>
  <form id="add">
    <input type="text" id="domain" placeholder="example.com or *.example.com">
    <button>Allow</button>
  </form>
  <p class="note">An allowed domain means the agent may act as you on that site whenever Chrome is open.</p>
  <p id="error"></p>
  <script src="popup.js"></script>
</body>
</html>
